name: Build and Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: true
        default: 'BOOKDECK Android Release v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: ./mobile
        run: npm ci --legacy-peer-deps

      - name: Generate Android native project (BOOKDECK)
        working-directory: ./mobile
        run: npx expo prebuild --platform android --clean

      - name: Make Gradle wrapper executable
        working-directory: ./mobile/android
        run: chmod +x gradlew

      - name: Build Android Release APK
        working-directory: ./mobile/android
        run: ./gradlew assembleRelease --no-daemon -x test

      - name: Package Release Assets
        id: package_apk
        run: |
          APK_PATH=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No release APK found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" BOOKDECK-v1.0.0.apk
          ls -lh BOOKDECK-v1.0.0.apk
          sha256sum BOOKDECK-v1.0.0.apk > checksums.txt

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BOOKDECK-v1.0.0-apk
          path: BOOKDECK-v1.0.0.apk
          if-no-files-found: error

      - name: Create GitHub Release and Attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag || github.ref_name }}
          name: ${{ github.event.inputs.release_title || format('BOOKDECK Android Release {0}', github.ref_name) }}
          draft: false
          prerelease: false
          files: |
            BOOKDECK-v1.0.0.apk
            checksums.txt
          body: |
            ## 📱 BOOKDECK Android Official Release v1.0.0

            Welcome to the official Android release of **BOOKDECK** — the campus bookstore and curriculum textbook platform.

            ### 🚀 Direct Download
            Click the attached asset **`BOOKDECK-v1.0.0.apk`** below to download and install on any Android phone.

            ---

            ### 📲 Installation Instructions (Android)
            1. Tap **`BOOKDECK-v1.0.0.apk`** to download the file to your Android device.
            2. When the download finishes, open your notification drawer or Downloads folder and tap the APK file.
            3. If prompted with *"For your security, your phone is not allowed to install unknown apps from this source"*, tap **Settings** and toggle **Allow from this source**.
            4. Tap **Install**, then tap **Open** to launch BOOKDECK.

            ---

            ### 📋 Specifications
            - **App Version**: `1.0.0`
            - **Package Name**: `com.bookdeck.app`
            - **Minimum Android Version**: Android 8.0 (Oreo / API 26) or higher
            - **Target Android Version**: Android 14 / 15 (API 34/35)
            - **Production Backend API**: `https://bookdeck-backend-hepr.onrender.com/api/v1`
            - **Release Date**: November 10, 2026

            ---
            *Built with React Native & Expo. Verified NDPA 2023 compliant.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

