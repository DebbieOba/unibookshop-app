<svg xmlns="http://www.w3.org/2000/svg" width="900" height="324" viewBox="0 0 900 324" font-family="Calibri, 'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="900" height="324" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4894A"/></marker></defs>
<rect x="0.5" y="0.5" width="899" height="289" fill="none" stroke="#CBD5E1" stroke-width="1"/>
<rect x="20" y="20" width="40" height="38" rx="8" fill="#FBEBD0" stroke="#B45309" stroke-width="1.5"/>
<text x="40.0" y="39.0" font-size="13" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">1</text>
<text x="470" y="31.5" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1F2937">Evaluated at one institution (FUTA) only — generalisation claimed, not</text>
<text x="470" y="46.5" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1F2937">yet tested</text>
<rect x="20" y="72" width="40" height="38" rx="8" fill="#FBEBD0" stroke="#B45309" stroke-width="1.5"/>
<text x="40.0" y="91.0" font-size="13" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">2</text>
<text x="470" y="83.5" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1F2937">Exchange/listing feature is contact-only; no in-app payment for peer</text>
<text x="470" y="98.5" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1F2937">resale</text>
<rect x="20" y="124" width="40" height="38" rx="8" fill="#FBEBD0" stroke="#B45309" stroke-width="1.5"/>
<text x="40.0" y="143.0" font-size="13" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">3</text>
<text x="470" y="135.5" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1F2937">No offline mode — a connectivity outage stops catalogue browsing</text>
<text x="470" y="150.5" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1F2937">entirely</text>
<rect x="20" y="176" width="40" height="38" rx="8" fill="#FBEBD0" stroke="#B45309" stroke-width="1.5"/>
<text x="40.0" y="195.0" font-size="13" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">4</text>
<text x="470" y="187.5" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1F2937">Usability testing sample was small and drawn from one department</text>
<text x="470" y="202.5" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1F2937">cohort</text>
<rect x="20" y="228" width="40" height="38" rx="8" fill="#FBEBD0" stroke="#B45309" stroke-width="1.5"/>
<text x="40.0" y="247.0" font-size="13" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">5</text>
<text x="470" y="239.5" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1F2937">Delivery logistics beyond pickup/delivery-method selection were out of</text>
<text x="470" y="254.5" font-size="11" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1F2937">scope</text>
<text x="450.0" y="312" font-size="11.5" text-anchor="middle" font-style="italic" fill="#475569">Figure 5.3. Limitations acknowledged in this study, stated plainly rather than left implicit.</text>

</svg>