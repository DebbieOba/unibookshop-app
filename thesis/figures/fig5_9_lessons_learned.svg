<svg xmlns="http://www.w3.org/2000/svg" width="940" height="384" viewBox="0 0 940 384" font-family="Calibri, 'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="940" height="384" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4894A"/></marker></defs>
<rect x="0.5" y="0.5" width="939" height="349" fill="none" stroke="#CBD5E1" stroke-width="1"/>
<rect x="20" y="20" width="260" height="60" rx="8" fill="#DCE3F5" stroke="#3B4E8F" stroke-width="1.5"/>
<text x="150.0" y="42.5" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">Verify server-side, never trust the</text>
<text x="150.0" y="57.5" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">client</text>
<text x="650" y="43.0" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1F2937">The stock-release bug (Section 3.5) existed exactly because a</text>
<text x="650" y="57.0" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1F2937">client-reported state was briefly trusted.</text>
<line x1="280" y1="50" x2="380" y2="50" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="20" y="100" width="260" height="60" rx="8" fill="#DCE3F5" stroke="#3B4E8F" stroke-width="1.5"/>
<text x="150.0" y="130.0" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">Overlap phases deliberately</text>
<text x="650" y="123.0" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1F2937">Waiting for literature review to 'finish' before designing</text>
<text x="650" y="137.0" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1F2937">would have cost real calendar time for no accuracy gain.</text>
<line x1="280" y1="130" x2="380" y2="130" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="20" y="180" width="260" height="60" rx="8" fill="#DCE3F5" stroke="#3B4E8F" stroke-width="1.5"/>
<text x="150.0" y="202.5" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">Free-tier services need a fallback</text>
<text x="150.0" y="217.5" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">plan</text>
<text x="650" y="203.0" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1F2937">A local network/firewall issue (Section 3, implementation</text>
<text x="650" y="217.0" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1F2937">notes) briefly looked like a Supabase outage.</text>
<line x1="280" y1="210" x2="380" y2="210" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="20" y="260" width="260" height="60" rx="8" fill="#DCE3F5" stroke="#3B4E8F" stroke-width="1.5"/>
<text x="150.0" y="282.5" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">Scope the exchange feature down, not</text>
<text x="150.0" y="297.5" font-size="11" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">up</text>
<text x="650" y="283.0" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1F2937">A full peer-to-peer marketplace was ruled out early precisely</text>
<text x="650" y="297.0" font-size="10" text-anchor="middle" font-weight="normal" font-style="normal" fill="#1F2937">so the core catalogue/checkout scope stayed achievable.</text>
<line x1="280" y1="290" x2="380" y2="290" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="470.0" y="372" font-size="11.5" text-anchor="middle" font-style="italic" fill="#475569">Figure 5.9. Practical lessons drawn from the project that would change how a similar build is approached next time.</text>

</svg>