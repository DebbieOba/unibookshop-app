<line x1="650" y1="322" x2="650" y2="335" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="430.0" y="423" font-size="11.5" text-anchor="middle" font-style="italic" fill="#475569">Figure 1.4. Side-by-side comparison of the manual process and the CURRICULA-mediated process for the same task.</text>

