<text x="650.0" y="300.0" font-size="11.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">Pay via Paystack/Flutterwave</text>
<line x1="210" y1="266" x2="210" y2="279" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="650" y1="266" x2="650" y2="279" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="335" width="340" height="42" rx="8" fill="#FBEBD0" stroke="#B45309" stroke-width="1.5"/>
<text x="210.0" y="356.0" font-size="11.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">Leave with no receipt/record</text>
