<line x1="650" y1="154" x2="650" y2="167" stroke="#334155" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="223" width="340" height="42" rx="8" fill="#FBEBD0" stroke="#B45309" stroke-width="1.5"/>
<text x="210.0" y="244.0" font-size="11.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">Wait for owner confirmation</text>
