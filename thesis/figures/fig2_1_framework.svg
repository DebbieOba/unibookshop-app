<svg xmlns="http://www.w3.org/2000/svg" width="800" height="234" viewBox="0 0 800 234" font-family="Calibri, 'Segoe UI', Arial, sans-serif">
<rect x="0" y="0" width="800" height="234" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker><marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4894A"/></marker></defs>
<rect x="0.5" y="0.5" width="799" height="199" fill="none" stroke="#CBD5E1" stroke-width="1"/>
<rect x="30" y="100" width="200" height="70" rx="8" fill="#FBEBD0" stroke="#B45309" stroke-width="1.5"/>
<text x="130.0" y="119.5" font-size="11.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">Low digital maturity (paper</text>
<text x="130.0" y="135.0" font-size="11.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">records, memory-based</text>
<text x="130.0" y="150.5" font-size="11.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">pricing)</text>
<line x1="230" y1="135" x2="300" y2="135" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300" y="100" width="200" height="70" rx="8" fill="#DCE3F5" stroke="#3B4E8F" stroke-width="1.5"/>
<text x="400.0" y="119.5" font-size="11.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">Targeted automation</text>
<text x="400.0" y="135.0" font-size="11.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">(searchable catalogue,</text>
<text x="400.0" y="150.5" font-size="11.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">shared price)</text>
<line x1="500" y1="135" x2="570" y2="135" stroke="#334155" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="570" y="100" width="200" height="70" rx="8" fill="#DCEEE5" stroke="#2F7D5C" stroke-width="1.5"/>
<text x="670.0" y="127.25" font-size="11.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">Reduced transaction</text>
<text x="670.0" y="142.75" font-size="11.5" text-anchor="middle" font-weight="bold" font-style="normal" fill="#1F2937">friction, faster sale</text>
<text x="430" y="40" font-size="12" text-anchor="middle" font-weight="italic" font-style="normal" fill="#475569">Digital Maturity Theory (Pinto et al., 2023) applied to a single small retailer</text>
<text x="400.0" y="222" font-size="11.5" text-anchor="middle" font-style="italic" fill="#475569">Figure 2.1. Conceptual framework: this study treats the bookshop problem as a digital-maturity gap that targeted automation closes.</text>

</svg>